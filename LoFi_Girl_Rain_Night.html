<!DOCTYPE html>
<html><head><style>
:root{--bar:60px}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.stage{
  position:fixed;left:0;top:0;
  width:100vw;
  height:calc(100vh - var(--bar));
  overflow:hidden;
}
iframe{
  position:absolute;
  left:50%;top:50%;
  width:max(100vw,calc((100vh - var(--bar)) * 1.7778));
  height:max(calc(100vh - var(--bar)),56.25vw);
  border:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(1.2);
}
.shield{position:fixed;inset:0;z-index:10}
</style></head><body>
<div class="stage">
<iframe src="https://www.youtube.com/embed/nx32Ue0AAA0?autoplay=1&mute=1&controls=0&disablekb=1&modestbranding=1&rel=0&iv_load_policy=3&cc_load_policy=0&loop=1&playlist=nx32Ue0AAA0"
  referrerpolicy="strict-origin-when-cross-origin"
  allow="autoplay; encrypted-media"></iframe>
</div>
<div class="shield"></div>
</body></html>
