<!DOCTYPE html>
<html><head><style>
:root{--bar:60px}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.stage{
  position:fixed;left:0;top:0;
  width:100vw;
  height:calc(100vh - var(--bar));
  overflow:hidden;
}
iframe{
  position:absolute;
  left:50%;top:50%;
  width:max(100vw,calc((100vh - var(--bar)) * 1.7778));
  height:max(calc(100vh - var(--bar)),56.25vw);
  border:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(1.2);
}
.shield{position:fixed;inset:0;z-index:10}
</style></head><body>
<div class="stage"><div id="player"></div></div>
<div class="shield"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var VIDEO_ID='nx32Ue0AAA0';
function killCaptions(p){
  try{p.unloadModule('captions');}catch(e){}
  try{p.unloadModule('cc');}catch(e){}
}
function onYouTubeIframeAPIReady(){
  new YT.Player('player',{
    videoId:VIDEO_ID,
    playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,modestbranding:1,rel:0,
      iv_load_policy:3,cc_load_policy:0,loop:1,playlist:VIDEO_ID,playsinline:1,enablejsapi:1},
    events:{
      onReady:function(e){e.target.mute();e.target.playVideo();killCaptions(e.target);},
      onStateChange:function(e){killCaptions(e.target);}
    }
  });
}
</script>
</body></html>
